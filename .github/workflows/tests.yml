name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    env:
      APP_TIMEZONE: America/New_York
      DB_CONNECTION: pgsql
      DB_PASSWORD: ci-postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: constructora_testing
          POSTGRES_USER: constructora_test
          POSTGRES_PASSWORD: ci-postgres
          TZ: America/New_York
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constructora_test -d constructora_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: exif, gd, intl, mbstring, pdo_pgsql, zip
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: php artisan test
